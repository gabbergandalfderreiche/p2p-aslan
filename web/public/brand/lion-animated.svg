<svg id="lion" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512" role="img" aria-label="Lion">
<title>Lion</title><style>
#lion .mane-back{transform-origin:100px 100px;animation:lion-sway 8s ease-in-out infinite}
#lion .mane-front{transform-origin:100px 100px;animation:lion-sway 8s ease-in-out infinite reverse}
#lion .head{transform-origin:100px 112px;animation:lion-breathe 5s ease-in-out infinite}
#lion .eyes{transform-box:fill-box;transform-origin:center;animation:lion-blink 7s infinite}
@keyframes lion-sway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}
@keyframes lion-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.018)}}
@keyframes lion-blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
@media (prefers-reduced-motion:reduce){#lion *{animation:none!important}}
</style>
