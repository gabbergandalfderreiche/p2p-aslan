# Result bot for the football bets on Base Sepolia (testnet, play money).
#
# Setup (GitHub → Settings → Secrets and variables → Actions):
#   KEEPER_PRIVATE_KEY    key of the bot wallet (= MatchBets curator). It can list matches and report
#                         results to UMA, nothing else. Fund it with a little Base Sepolia ETH.
#   FOOTBALL_DATA_TOKEN   free API key from football-data.org
#   BASE_SEPOLIA_RPC_URL  optional; the public https://sepolia.base.org is used otherwise
#
# Until contracts/deployments/84532.json exists the job just logs and exits.
name: Results

on:
  schedule:
    - cron: "*/15 * * * *" # every 15 minutes (GitHub may delay scheduled runs)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only check, do not send transactions"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: results
  cancel-in-progress: false

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: keeper/package-lock.json

      - name: Install
        working-directory: keeper
        run: npm ci

      - name: Run
        env:
          RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL || 'https://sepolia.base.org' }}
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          DEPLOYMENT: contracts/deployments/84532.json
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: node keeper/src/results.mjs
